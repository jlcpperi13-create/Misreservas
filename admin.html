<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MisReservas — Panel</title>
<meta name="theme-color" content="#171A1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171A1F;
    --surface:#1F242B;
    --surface-raised:#262C34;
    --text:#F3F1EA;
    --text-muted:#8A9099;
    --amber:#E8A33D;
    --teal:#4FA3A0;
    --red:#D9634B;
    --divider:rgba(255,255,255,0.08);
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:20px 20px 14px;
    border-bottom:1px solid var(--divider);
  }
  .brand{font-size:17px;font-weight:600;}
  .brand span{color:var(--amber);}
  .summary{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
    color:var(--text-muted);
    font-size:13px;
  }
  .tabs{
    display:flex;
    gap:2px;
    padding:14px 20px 0;
  }
  .tab{
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    padding:8px 4px 10px;
    margin-right:18px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--text); border-bottom-color:var(--amber);}

  #list{
    max-width:720px;
    margin:0 auto;
    padding:6px 20px 60px;
  }
  .empty{
    color:var(--text-muted);
    font-size:14px;
    padding:60px 0;
    text-align:center;
  }
  .row{
    display:grid;
    grid-template-columns:64px 1fr auto;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--divider);
    cursor:pointer;
  }
  .row .time{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:16px;
    font-weight:600;
  }
  .row .info .route{font-size:15px;}
  .row .info .meta{
    color:var(--text-muted);
    font-size:12.5px;
    margin-top:3px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    justify-self:end;
  }
  .dot.pendiente{background:var(--amber);}
  .dot.confirmada{background:var(--teal);}
  .dot.cancelada{background:var(--red);}

  /* Panel de detalle */
  .overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(10,11,13,0.6);
    z-index:10;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--surface);
    border-top:1px solid var(--divider);
    border-radius:8px 8px 0 0;
    padding:22px 22px 28px;
  }
  .sheet h2{font-size:19px;font-weight:500;margin:0 0 4px;}
  .sheet .status-label{font-size:13px;margin-bottom:16px;}
  .sheet .status-label.pendiente{color:var(--amber);}
  .sheet .status-label.confirmada{color:var(--teal);}
  .sheet .status-label.cancelada{color:var(--red);}
  .sheet dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0 0 20px;}
  .sheet dt{color:var(--text-muted);font-size:13px;}
  .sheet dd{margin:0;font-size:14.5px;}
  .actions{display:flex;gap:10px;}
  .actions button{
    flex:1;
    padding:13px;
    border-radius:var(--radius);
    border:1px solid var(--divider);
    background:var(--surface-raised);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    cursor:pointer;
  }
  .actions .confirm{background:var(--teal);border-color:var(--teal);color:#0D1F1E;font-weight:600;}
  .actions .cancel{background:none;border-color:var(--red);color:var(--red);}
  .closeSheet{
    display:block;
    margin:16px auto 0;
    background:none;border:none;
    color:var(--text-muted);
    font-size:13px;
    cursor:pointer;
  }

  .loginView{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .loginCard{
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:1px solid var(--divider);
    border-radius:var(--radius);
    padding:26px 24px 24px;
  }
  .loginCard .sub{
    color:var(--text-muted);
    font-size:13.5px;
    margin:6px 0 20px;
  }
  .loginCard .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .loginCard label{font-size:13px;color:var(--text-muted);}
  .loginCard input{
    background:var(--surface-raised);
    border:1px solid var(--divider);
    border-radius:var(--radius);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    padding:12px 13px;
    outline:none;
  }
  .loginCard input:focus{border-color:var(--amber);}
  .loginCard .error{color:var(--red);font-size:13px;min-height:16px;}
  .loginCard .submit{
    width:100%;
    background:var(--amber);
    color:#1A1409;
    border:none;
    border-radius:var(--radius);
    padding:13px;
    font-size:15px;
    font-weight:600;
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
  }
  .logoutBtn{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:12.5px;
    cursor:pointer;
    margin-left:12px;
  }
</style>
</head>
<body>
<div class="loginView" id="loginView">
  <div class="loginCard">
    <div class="brand">Mis<span>Reservas</span> · Panel</div>
    <p class="sub">Accede con tu cuenta de conductor.</p>
    <div class="field">
      <label for="loginEmail">Correo</label>
      <input type="text" id="loginEmail" placeholder="tucorreo@ejemplo.com">
    </div>
    <div class="field">
      <label for="loginPass">Contraseña</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <div class="error" id="loginError"></div>
    <button class="submit" id="loginBtn">Entrar</button>
  </div>
</div>

<div class="app" id="appView" style="display:none;">
<header>
  <div class="brand">Mis<span>Reservas</span> · Panel</div>
  <div>
    <span class="summary" id="summary">— reservas</span>
    <button class="logoutBtn" id="logoutBtn">Salir</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-filter="hoy">Hoy</button>
  <button class="tab" data-filter="proximas">Próximas</button>
  <button class="tab" data-filter="todas">Todas</button>
</div>

<div id="list">
  <div class="empty" id="emptyMsg">Cargando reservas…</div>
</div>

</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sTitle">—</h2>
    <div class="status-label" id="sStatus">—</div>
    <dl>
      <dt>Fecha</dt><dd id="sFecha">—</dd>
      <dt>Hora</dt><dd id="sHora">—</dd>
      <dt>Cliente</dt><dd id="sNombre">—</dd>
      <dt>Teléfono</dt><dd id="sTelefono">—</dd>
      <dt>Pasajeros</dt><dd id="sPasajeros">—</dd>
      <dt>Maletas</dt><dd id="sMaletas">—</dd>
      <dt>Código</dt><dd id="sCodigo">—</dd>
    </dl>
    <div class="actions">
      <button class="cancel" id="btnCancel">Cancelar</button>
      <button class="confirm" id="btnConfirm">Confirmar</button>
    </div>
    <button class="closeSheet" id="btnClose">Cerrar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  let allReservas = [];
  let currentFilter = 'hoy';
  let unsubscribe = null;
  let selected = null;

  function startOfToday(){
    const d = new Date(); d.setHours(0,0,0,0); return d;
  }
  function endOfToday(){
    const d = new Date(); d.setHours(23,59,59,999); return d;
  }

  function subscribe(){
    if(unsubscribe) unsubscribe();
    unsubscribe = db.collection('reservas')
      .orderBy('fechaHora', 'asc')
      .onSnapshot(snap=>{
        allReservas = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
        render();
      }, err=>{
        document.getElementById('emptyMsg').textContent =
          'No se pudo conectar. Revisa la configuración de Firebase.';
        console.error(err);
      });
  }

  function render(){
    const now = new Date();
    let items = allReservas.filter(r => r.estado !== 'cancelada' || currentFilter === 'todas');

    if(currentFilter === 'hoy'){
      const s = startOfToday(), e = endOfToday();
      items = items.filter(r=>{
        const t = r.fechaHora.toDate();
        return t >= s && t <= e;
      });
    } else if(currentFilter === 'proximas'){
      items = items.filter(r => r.fechaHora.toDate() >= now);
    }

    const list = document.getElementById('list');
    const emptyMsg = document.getElementById('emptyMsg');
    document.getElementById('summary').textContent = `${items.length} reserva${items.length === 1 ? '' : 's'}`;

    list.querySelectorAll('.row').forEach(r=>r.remove());

    if(items.length === 0){
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = 'No hay reservas en este rango.';
      return;
    }
    emptyMsg.style.display = 'none';

    items.forEach(r=>{
      const row = document.createElement('div');
      row.className = 'row';
      const time = r.fechaHora.toDate().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
      row.innerHTML = `
        <div class="time">${time}</div>
        <div class="info">
          <div class="route">${r.origen} → ${r.destino}</div>
          <div class="meta">${r.nombre} · ${r.pasajeros} pas · ${r.maletas} mal</div>
        </div>
        <div class="dot ${r.estado}"></div>
      `;
      row.addEventListener('click', ()=>openSheet(r));
      list.appendChild(row);
    });
  }

  function openSheet(r){
    selected = r;
    document.getElementById('sTitle').textContent = `${r.origen} → ${r.destino}`;
    document.getElementById('sStatus').textContent =
      r.estado === 'pendiente' ? 'Pendiente de confirmar' :
      r.estado === 'confirmada' ? 'Confirmada' : 'Cancelada';
    document.getElementById('sStatus').className = 'status-label ' + r.estado;
    document.getElementById('sFecha').textContent = r.fechaTexto.split('-').reverse().join('/');
    document.getElementById('sHora').textContent = r.horaTexto;
    document.getElementById('sNombre').textContent = r.nombre;
    document.getElementById('sTelefono').textContent = r.telefono;
    document.getElementById('sPasajeros').textContent = r.pasajeros;
    document.getElementById('sMaletas').textContent = r.maletas;
    document.getElementById('sCodigo').textContent = r.codigo;
    document.getElementById('overlay').classList.add('show');
  }

  document.getElementById('btnClose').addEventListener('click', ()=>{
    document.getElementById('overlay').classList.remove('show');
  });
  document.getElementById('overlay').addEventListener('click', (e)=>{
    if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('show');
  });

  document.getElementById('btnConfirm').addEventListener('click', async ()=>{
    if(!selected) return;
    await db.collection('reservas').doc(selected.id).update({estado:'confirmada'});
    document.getElementById('overlay').classList.remove('show');
  });
  document.getElementById('btnCancel').addEventListener('click', async ()=>{
    if(!selected) return;
    await db.collection('reservas').doc(selected.id).update({estado:'cancelada'});
    document.getElementById('overlay').classList.remove('show');
  });

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  // Autenticación: solo se muestra el panel si hay sesión iniciada
  firebase.auth().onAuthStateChanged(user=>{
    if(user){
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('appView').style.display = 'block';
      subscribe();
    } else {
      document.getElementById('loginView').style.display = 'flex';
      document.getElementById('appView').style.display = 'none';
      if(unsubscribe) unsubscribe();
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    try{
      await firebase.auth().signInWithEmailAndPassword(email, pass);
    }catch(err){
      errorEl.textContent = 'Correo o contraseña incorrectos.';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    firebase.auth().signOut();
  });
</script>
</body>
</html>
