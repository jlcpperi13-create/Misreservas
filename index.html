<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171A1F">
<title>MisReservas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="cliente-192.png">
<link rel="apple-touch-icon" href="cliente-180.png">
<style>
:root{--bg:#171A1F;--card:#1F242C;--line:#303742;--ink:#ECEFF3;--muted:#98A2B0;--amber:#E8A33D;--amber-ink:#231600;--ok:#4CC38A;--bad:#F07A6E}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-weight:700;font-size:1.25rem;white-space:nowrap}.brand span{color:var(--amber)}
.acct{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:.85rem;cursor:pointer;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--amber);color:var(--amber-ink)}
.field{margin-bottom:14px}
label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:6px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:12px 14px;font:inherit;min-height:48px}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.counter{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px 8px 14px;margin-bottom:12px}
.counter div{display:flex;align-items:center;gap:14px}
.counter button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:1.3rem;cursor:pointer}
.counter output{min-width:1.5em;text-align:center;font-weight:600;font-size:1.1rem}
.error{color:var(--bad);min-height:1.3em;margin:6px 0 10px}
.submit{width:100%;background:var(--amber);color:var(--amber-ink);border:0;border-radius:6px;padding:15px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.submit:disabled{opacity:.6}
.ghost{width:100%;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:13px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.day{color:var(--muted);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;transition:border-color .3s}
.res.flash{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.res.old{opacity:.7}
.res .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res .when{font-weight:700;font-size:1.15rem}
.pill{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.pendiente{background:rgba(232,163,61,.18);color:var(--amber)}
.pill.confirmada{background:rgba(76,195,138,.18);color:var(--ok)}
.pill.cancelada{background:rgba(240,122,110,.18);color:var(--bad)}
.res .route{margin-top:6px;overflow-wrap:anywhere}
.res .meta{color:var(--muted);font-size:.88rem;margin-top:4px;overflow-wrap:anywhere}
.assign{margin-top:10px;border-left:3px solid var(--ok);padding:7px 10px;background:rgba(76,195,138,.08);border-radius:0 6px 6px 0;overflow-wrap:anywhere}
.assign b{font-size:1.1rem}
.res .cancel{margin-top:10px;background:none;border:1px solid var(--line);color:var(--bad);border-radius:6px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px;font-size:1.15rem}
dialog p{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;max-width:min(92vw,480px);z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Mis<span>Reservas</span></div>
    <button class="acct" id="acctBtn" type="button">Clientes habituales: entrar</button>
  </header>

  <div class="tabs">
    <button type="button" id="tabNueva" class="on">Nueva reserva</button>
    <button type="button" id="tabMias">Mis reservas</button>
  </div>

  <section id="viewNueva">
    <form id="bookingForm" novalidate>
      <div class="row2">
        <div class="field"><label for="fecha">Fecha</label><input type="date" id="fecha"></div>
        <div class="field"><label for="hora">Hora</label><input type="time" id="hora"></div>
      </div>
      <div class="field"><label for="origen">Origen</label><input type="text" id="origen" autocomplete="off"></div>
      <div class="field"><label for="destino">Destino</label><input type="text" id="destino" autocomplete="off"></div>
      <div class="field"><label for="nombre">Nombre</label><input type="text" id="nombre" autocomplete="name"></div>
      <div class="field"><label for="telefono">Teléfono</label><input type="tel" id="telefono" inputmode="tel" autocomplete="tel"></div>
      <div class="counter"><span>Pasajeros</span><div><button type="button" data-k="pasajeros" data-d="-1" aria-label="Menos pasajeros">−</button><output id="pasajerosCount">1</output><button type="button" data-k="pasajeros" data-d="1" aria-label="Más pasajeros">+</button></div></div>
      <div class="counter"><span>Maletas</span><div><button type="button" data-k="maletas" data-d="-1" aria-label="Menos maletas">−</button><output id="maletasCount">0</output><button type="button" data-k="maletas" data-d="1" aria-label="Más maletas">+</button></div></div>
      <div class="field"><label for="notas">Notas (opcional)</label><textarea id="notas" placeholder="Habitación, número de vuelo, silla de niño…"></textarea></div>
      <div class="error" id="formError"></div>
      <button class="submit" id="submitBtn" type="submit">Confirmar reserva</button>
    </form>
  </section>

  <section id="viewMias" hidden>
    <div id="mias"><p class="empty">Cargando…</p></div>
  </section>
</div>

<dialog id="loginDlg">
  <h2>Clientes habituales</h2>
  <p>Entra con la cuenta que te ha dado el taxista para ver todas tus reservas desde cualquier dispositivo.</p>
  <div class="field"><label for="lEmail">Correo</label><input type="email" id="lEmail" autocomplete="username"></div>
  <div class="field"><label for="lPass">Contraseña</label><input type="password" id="lPass" autocomplete="current-password"></div>
  <div class="error" id="lError"></div>
  <button class="submit" type="button" id="lBtn">Entrar</button>
  <button class="ghost" type="button" id="lClose">Cerrar</button>
</dialog>

<dialog id="outDlg">
  <h2 id="outTitle">Cuenta</h2>
  <p>Si sales, en este dispositivo dejarás de ver tus reservas hasta que vuelvas a entrar.</p>
  <button class="submit" type="button" id="outBtn">Salir de la cuenta</button>
  <button class="ghost" type="button" id="outClose">Cerrar</button>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const fauth=firebase.auth(), fdb=firebase.firestore();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ESTADO={pendiente:'Pendiente',confirmada:'Confirmada',cancelada:'Cancelada'};
const counts={pasajeros:1,maletas:0};
let unsub=null, mine=[], prev={}, firstSnap=true, flashIds=new Set(), cancelArmed=null;

/* ---- valores iniciales ---- */
(function initForm(){
  const d=new Date(Date.now()+60*60000); d.setMinutes(0,0,0);
  $('fecha').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  $('hora').value=pad(d.getHours())+':00';
  try{const c=JSON.parse(localStorage.getItem('mr-cliente')||'{}');if(c.nombre)$('nombre').value=c.nombre;if(c.telefono)$('telefono').value=c.telefono;}catch(e){}
})();
document.querySelectorAll('.counter button').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.k, min=k==='pasajeros'?1:0;
  counts[k]=Math.min(8,Math.max(min,counts[k]+Number(b.dataset.d)));
  $(k+'Count').textContent=counts[k];
}));

/* ---- pestañas ---- */
function showTab(t){
  $('tabNueva').classList.toggle('on',t==='nueva');$('tabMias').classList.toggle('on',t==='mias');
  $('viewNueva').hidden=t!=='nueva';$('viewMias').hidden=t!=='mias';
  if(t==='mias')renderMine();
}
$('tabNueva').onclick=()=>showTab('nueva');
$('tabMias').onclick=()=>showTab('mias');

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,6000);}

/* ---- cuenta ---- */
function renderAcct(u){
  const b=$('acctBtn');
  if(u&&!u.isAnonymous){b.textContent=(u.email||'Mi cuenta');}
  else b.textContent='Clientes habituales: entrar';
}
$('acctBtn').onclick=()=>{
  const u=fauth.currentUser;
  if(u&&!u.isAnonymous){$('outTitle').textContent=u.email||'Cuenta';$('outDlg').showModal();}
  else{$('lError').textContent='';$('loginDlg').showModal();}
};
$('lClose').onclick=()=>$('loginDlg').close();
$('outClose').onclick=()=>$('outDlg').close();
$('outBtn').onclick=async()=>{await fauth.signOut();$('outDlg').close();toast('Has salido de la cuenta.');};
$('lBtn').onclick=async()=>{
  const email=$('lEmail').value.trim(), pass=$('lPass').value;
  if(!email||!pass){$('lError').textContent='Escribe el correo y la contraseña.';return;}
  $('lBtn').disabled=true;
  try{
    await fauth.signInWithEmailAndPassword(email,pass);
    $('loginDlg').close();$('lPass').value='';
    toast('Sesión iniciada.');showTab('mias');
  }catch(err){
    const c=err.code||'';
    $('lError').textContent=(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))?'Correo o contraseña incorrectos.':'Error: '+(c||err.message);
  }finally{$('lBtn').disabled=false;}
};

/* ---- mis reservas en directo ---- */
fauth.onAuthStateChanged(u=>{
  renderAcct(u);
  if(unsub){unsub();unsub=null;}
  mine=[];prev={};firstSnap=true;
  if(!u){renderMine();return;}
  unsub=fdb.collection('reservas').where('clienteUid','==',u.uid).onSnapshot(s=>{
    mine=s.docs.map(d=>({id:d.id,...d.data()}));
    detectChanges();renderMine();
  },err=>{console.error(err);$('mias').innerHTML='<p class="empty">No se pudieron cargar tus reservas ('+esc(err.code||err.message)+').</p>';});
});

function sig(r){return [r.estado,r.taxi||'',r.conductor||'',r.notaCliente||''].join('|');}
function detectChanges(){
  const changed=[];
  for(const r of mine){const s=sig(r);if(!firstSnap&&prev[r.id]&&prev[r.id]!==s)changed.push(r);prev[r.id]=s;}
  firstSnap=false;
  if(!changed.length)return;
  changed.forEach(r=>flashIds.add(r.id));
  const r=changed[0];
  let msg;
  if(r.estado==='confirmada')msg='Confirmada: '+r.horaTexto+' desde '+r.origen+(r.taxi?'. Taxi '+r.taxi:'');
  else if(r.estado==='cancelada')msg='Cancelada: reserva de las '+r.horaTexto;
  else msg='Tu reserva de las '+r.horaTexto+' ha cambiado';
  toast(msg);
  try{if(navigator.vibrate)navigator.vibrate([300,150,300]);}catch(e){}
  setTimeout(()=>{changed.forEach(x=>flashIds.delete(x.id));renderMine();},8000);
}

function dayLabel(d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const diff=Math.round((x-t)/86400000);
  if(diff===0)return 'Hoy';if(diff===1)return 'Mañana';if(diff===-1)return 'Ayer';
  return x.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
}
function card(r,old){
  const assign=(r.taxi||r.conductor||r.notaCliente)?'<div class="assign">'+(r.taxi?'<b>Taxi '+esc(r.taxi)+'</b>':'')+(r.conductor?'<div>Conductor: '+esc(r.conductor)+'</div>':'')+(r.notaCliente?'<div>'+esc(r.notaCliente)+'</div>':'')+'</div>':'';
  const meta=[r.nombre,r.pasajeros+(r.pasajeros==1?' pasajero':' pasajeros'),r.maletas?r.maletas+(r.maletas==1?' maleta':' maletas'):'','Código '+r.codigo].filter(Boolean).map(esc).join(', ');
  const canCancel=r.estado==='pendiente'&&!old;
  return '<div class="res'+(flashIds.has(r.id)?' flash':'')+(old?' old':'')+'">'+
    '<div class="top"><span class="when">'+esc(r.horaTexto)+'</span><span class="pill '+esc(r.estado)+'">'+esc(ESTADO[r.estado]||r.estado)+'</span></div>'+
    '<div class="route">'+esc(r.origen)+' → '+esc(r.destino)+'</div>'+
    '<div class="meta">'+meta+'</div>'+(r.notas?'<div class="meta">'+esc(r.notas)+'</div>':'')+
    assign+
    (canCancel?'<button type="button" class="cancel" data-id="'+esc(r.id)+'">'+(cancelArmed===r.id?'Pulsa otra vez para cancelar':'Cancelar reserva')+'</button>':'')+
    '</div>';
}
function renderMine(){
  const el=$('mias');
  if(!fauth.currentUser||!mine.length){
    el.innerHTML='<p class="empty">'+(fauth.currentUser?'Todavía no hay reservas. Las que hagas aparecerán aquí con su estado.':'Aquí verás tus reservas y cuándo las confirmo. Haz una reserva, o entra con tu cuenta si eres cliente habitual.')+'</p>';
    return;
  }
  const now=Date.now()-2*3600000;
  const ms=r=>r.fechaHora&&r.fechaHora.toMillis?r.fechaHora.toMillis():0;
  const prox=mine.filter(r=>ms(r)>=now).sort((a,b)=>ms(a)-ms(b));
  const ant=mine.filter(r=>ms(r)<now).sort((a,b)=>ms(b)-ms(a)).slice(0,20);
  let html='',cur='';
  for(const r of prox){const l=dayLabel(ms(r));if(l!==cur){cur=l;html+='<div class="day">'+esc(l)+'</div>';}html+=card(r,false);}
  if(!prox.length)html+='<p class="empty">No tienes reservas próximas.</p>';
  if(ant.length){html+='<div class="day">Anteriores</div>';for(const r of ant)html+=card(r,true);}
  el.innerHTML=html;
}
$('mias').addEventListener('click',async e=>{
  const b=e.target.closest('.cancel');if(!b)return;
  const id=b.dataset.id;
  if(cancelArmed!==id){cancelArmed=id;renderMine();return;}
  cancelArmed=null;
  try{await fdb.collection('reservas').doc(id).update({estado:'cancelada'});toast('Reserva cancelada.');}
  catch(err){toast('No se pudo cancelar ('+(err.code||err.message)+').');renderMine();}
});

/* ---- enviar reserva ---- */
function generarCodigo(){return 'R'+Math.random().toString(36).slice(2,7).toUpperCase();}
$('bookingForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const errorEl=$('formError'), btn=$('submitBtn');
  errorEl.textContent='';
  const fecha=$('fecha').value, hora=$('hora').value;
  const origen=$('origen').value.trim(), destino=$('destino').value.trim();
  const nombre=$('nombre').value.trim(), telefono=$('telefono').value.trim(), notas=$('notas').value.trim();
  if(!fecha||!hora||!origen||!destino||!nombre||!telefono){errorEl.textContent='Falta rellenar algún campo.';return;}
  const fechaHora=new Date(fecha+'T'+hora);
  if(fechaHora<new Date()){errorEl.textContent='La fecha y hora ya han pasado.';return;}
  btn.disabled=true;btn.textContent='Enviando…';
  try{
    if(!fauth.currentUser){try{await fauth.signInAnonymously();}catch(err){console.warn('Sin acceso anónimo',err);}}
    const u=fauth.currentUser;
    const codigo=generarCodigo();
    const data={codigo,nombre,telefono,origen,destino,pasajeros:counts.pasajeros,maletas:counts.maletas,
      fechaHora:firebase.firestore.Timestamp.fromDate(fechaHora),fechaTexto:fecha,horaTexto:hora,
      estado:'pendiente',creadoEn:firebase.firestore.FieldValue.serverTimestamp()};
    if(notas)data.notas=notas;
    if(u){data.clienteUid=u.uid;if(!u.isAnonymous&&u.email)data.clienteCuenta=u.email;}
    await fdb.collection('reservas').add(data);
    try{localStorage.setItem('mr-cliente',JSON.stringify({nombre,telefono}));}catch(e){}
    $('origen').value='';$('destino').value='';$('notas').value='';
    counts.pasajeros=1;counts.maletas=0;$('pasajerosCount').textContent='1';$('maletasCount').textContent='0';
    if(u){toast('Reserva enviada (código '+codigo+'). Aquí verás cuándo la confirmo.');showTab('mias');}
    else toast('Reserva enviada. Tu código es '+codigo+'.');
  }catch(err){
    console.error(err);
    errorEl.textContent='Error: '+(err.code||err.message);
  }finally{btn.disabled=false;btn.textContent='Confirmar reserva';}
});
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
